
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บไซต์แรกของฉัน</title>
  <style>
    body {
      font-family: sans-serif;
      background: #eef2ff;
      color: #222;
      text-align: center;
      margin: 0;
    }
    header {
      background: #3155c6;
      color: white;
      padding: 35px 15px;
    }
    main {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }
    section {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 10px #00000010;
    }
    h2 { color: #3155c6; }
    button {
      background: #3155c6;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>เว็บไซต์แรกของฉัน</h1>
    <p>เว็บไซต์นำเสนอโครงงานโรงเรียน</p>
  </header>
  <main>
    <section>
      <h2>เกี่ยวกับโครงงาน</h2>
      <p>เว็บไซต์นี้จัดทำขึ้นเพื่อฝึกทักษะการเขียนเว็บไซต์</p>
    </section>
    <section>
      <h2>วัตถุประสงค์</h2>
      <p>เรียนรู้ HTML และ CSS</p>
      <p>ฝึกออกแบบเว็บไซต์ด้วยตนเอง</p>
      <p>นำเสนอผลงานผ่านระบบออนไลน์</p>
    </section>
    <section>
      <h2>ผู้จัดทำ</h2>
      <p>ชื่อ: ใส่ชื่อของคุณ</p>
      <p>ชั้นเรียน: ใส่ชั้นเรียนของคุณ</p>
      <button onclick="alert('ขอบคุณที่เข้าชมเว็บไซต์!')">
        คลิกที่นี่
      </button>
    </section>
  </main>
</body>
</html>
